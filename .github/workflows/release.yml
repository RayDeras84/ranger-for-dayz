name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm.cmd run lint

      - name: Test
        run: npm.cmd test

      - name: Audit
        run: npm.cmd audit --omit=optional

      - name: Build and publish unsigned release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm.cmd run release
