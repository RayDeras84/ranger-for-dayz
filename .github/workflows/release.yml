name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate release context
        env:
          RFDZ_RELEASE_ACTOR: RayDeras84
        run: node scripts/validate-release-version.mjs

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm.cmd run lint

      - name: Test
        run: npm.cmd test

      - name: Audit
        run: npm.cmd audit --omit=optional

      - name: Build unsigned release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm.cmd run release

      - name: Publish draft release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:GITHUB_REF_NAME
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $assets = @(
            "release/Ranger-for-DayZ-Setup-$version-x64.exe",
            "release/Ranger-for-DayZ-Setup-$version-x64.exe.blockmap",
            "release/latest.yml"
          )

          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset)) {
              throw "Missing release asset: $asset"
            }
          }

          & gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            $uploadArgs = @("release", "upload", $tag) + $assets + @("--repo", $env:GITHUB_REPOSITORY, "--clobber")
            & gh @uploadArgs
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to upload release assets for $tag."
            }
          } else {
            $createArgs = @("release", "create", $tag) + $assets + @(
              "--repo", $env:GITHUB_REPOSITORY,
              "--draft",
              "--title", $version,
              "--notes", "Draft release for $tag."
            )
            & gh @createArgs
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create draft release for $tag."
            }
          }
