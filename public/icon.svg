  <path d="M58 96A77 77 0 0 1 163 60" stroke="#82ad79" stroke-width="14" stroke-linecap="round"/>
  <path d="M84 116A49 49 0 0 1 151 94" stroke="#f0d47b" stroke-width="14" stroke-linecap="round"/>
  <circle cx="179" cy="102" r="10" fill="#f0d47b"/>

  <text x="43" y="184" fill="#eef2df" font-family="Segoe UI Black, Arial Black, Arial, sans-serif" font-size="88" font-weight="900" letter-spacing="-8">RD</text>
  <path d="M171 126H216L178 184H220" stroke="#f0d47b" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
