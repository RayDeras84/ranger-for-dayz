<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Ranger for DayZ icon</title>
  <desc id="desc">An RDZ monogram with angled beacon marks for Ranger for DayZ.</desc>
  <defs>
    <linearGradient id="field" x1="14" y1="14" x2="242" y2="242" gradientUnits="userSpaceOnUse">
      <stop stop-color="#24392e"/>
      <stop offset="0.52" stop-color="#17221c"/>
      <stop offset="1" stop-color="#314533"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(118 120) rotate(90) scale(104)">
      <stop stop-color="#8ab17c" stop-opacity="0.26"/>
